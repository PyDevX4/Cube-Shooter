# Cube Shooter multiplayer server on Fly.io.  Deploy from this folder with:  fly deploy
app = "cube-shooter-server"
primary_region = "ord"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # Lobbies live in memory, so the server must not be stopped while people play
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
